<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop It! - Whac-A-Mole</title>
    <!-- fonts imported from google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-pink">
    <!--bg bubbles-->
    <ul class="bg-bubbles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <div class="app-container">

        <header class="header">
            <div style="position: relative; display: inline-block;">
                <h1 class="title" id="mainTitle">Pop It!</h1>
                <div id="titleHint" class="comic-hint">Psst... tap me 5 times!</div>
            </div>
            <p class="subtitle">Infinite whac-a-mole. Keep the board flat.</p>
        </header>

        <div class="scoreboard">
            <div class="stat-box highlight">
                <div class="stat-value" id="scoreDisplay">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="bestDisplay">0</div>
                <div class="stat-label">Best</div>
            </div>
        </div>

        <div class="board-card">
            <!-- game bubbles go here -->
            <div class="grid" id="board">
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="playBtn">Play</button>
            <button class="btn" id="resetBtn">Reset</button>
            <button class="btn" id="darkBtn">Night</button>
            <button class="btn" id="soundBtn">Sound</button>
        </div>

        <div class="theme-picker">
            <span class="theme-label">Color Theme:</span>
            <div class="theme-dots">
                <button class="theme-dot active" data-theme="pink"></button>
                <button class="theme-dot" data-theme="purple"></button>
                <button class="theme-dot" data-theme="blue"></button>
                <button class="theme-dot" data-theme="green"></button>
                <button class="theme-dot" data-theme="orange"></button>
            </div>
        </div>

        <div id="cuteBunny">
            <div id="bunnySpeech" class="speech-bubble"></div>
            <img id="theBunnyFace" src="assets/bunny-happy.svg" alt="Cute Bunny" style="width: 100%; height: 100%;">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
